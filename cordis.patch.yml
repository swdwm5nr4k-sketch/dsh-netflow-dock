# dsh-netflow-dock —— 把这整段追加到目标 profile 的 cordis.patch.yml 末尾，
# 用来把本插件插进该 profile 的 Loader 配置树（默认路径 ~/.dsh/profiles/web/cordis.patch.yml）。
#
# 行 id `netflow-dock` 必须在该 profile 内唯一；若已占用，改成一个没用过的 id
# （客户端半边向 conversation.composer.dock 注册的格子 id 是 `netflow`，与本行 id 无关）。
- insert:
    - id: netflow-dock
      name: dsh-netflow-dock
